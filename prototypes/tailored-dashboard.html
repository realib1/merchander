<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchander - Tailored Dashboard & Dynamic Sidebar</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: var(--bg-page);
    }

    /* Top Prototype Control Banner */
    .prototype-banner {
      background: linear-gradient(90deg, #161F33 0%, #111726 100%);
      border-bottom: 1px solid var(--border-subtle);
      padding: var(--space-3) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      font-size: var(--text-caption);
    }

    [data-theme="light"] .prototype-banner {
      background: linear-gradient(90deg, #F1F5F9 0%, #E2E8F0 100%);
    }

    .archetype-pill-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-surface);
      padding: 3px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
    }

    .archetype-pill {
      border: none;
      background: transparent;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      font-size: var(--text-caption);
      font-weight: var(--font-weight-medium);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }

    .archetype-pill:hover {
      color: var(--text-primary);
    }

    .archetype-pill.active {
      background-color: var(--brand-primary);
      color: #FFFFFF;
      font-weight: var(--font-weight-semibold);
      box-shadow: 0 1px 4px rgba(255, 106, 0, 0.3);
    }

    /* Main App Layout */
    .app-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 50px);
    }

    /* Dynamic Sidebar */
    .app-sidebar {
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: var(--space-5) var(--space-3);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-3) var(--space-5);
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: var(--space-4);
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #FF6A00 0%, #FF944D 100%);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-weight: var(--font-weight-bold);
      font-size: var(--text-body-sm);
    }

    .store-label {
      font-family: var(--font-display);
      font-size: var(--text-body-sm);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      line-height: 1.2;
    }

    .sidebar-section-title {
      font-size: 10px;
      font-weight: var(--font-weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: var(--space-2) var(--space-3);
      margin-top: var(--space-2);
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      list-style: none;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: 8px 12px;
      border-radius: var(--radius-md);
      font-size: var(--text-body-sm);
      color: var(--text-secondary);
      font-weight: var(--font-weight-medium);
      text-decoration: none;
      transition: all var(--transition-fast);
    }

    .nav-item a:hover {
      color: var(--text-primary);
      background-color: var(--bg-surface-elevated);
    }

    .nav-item.active a {
      color: var(--brand-primary);
      background-color: var(--bg-surface-elevated);
      font-weight: var(--font-weight-semibold);
      border-left: 3px solid var(--brand-primary);
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }

    .nav-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background-color: var(--brand-primary-light, rgba(255, 106, 0, 0.15));
      color: var(--brand-primary);
      font-weight: var(--font-weight-semibold);
    }

    /* Main Dashboard Area */
    .dashboard-main {
      padding: var(--space-8);
      overflow-y: auto;
    }

    .dashboard-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-6);
    }

    .dashboard-archetype-badge {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-caption);
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* KPI Metric Cards Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }

    .kpi-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
      position: relative;
    }

    .kpi-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }

    .kpi-label {
      font-size: var(--text-caption);
      color: var(--text-muted);
      font-weight: var(--font-weight-medium);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: var(--space-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-value {
      font-family: var(--font-display);
      font-size: var(--text-h2);
      font-weight: var(--font-weight-bold);
      color: var(--text-primary);
      margin-bottom: var(--space-1);
    }

    .kpi-delta {
      font-size: var(--text-caption);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Main Content Sections */
    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--space-6);
    }

    .table-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--text-body-sm);
    }

    th {
      text-align: left;
      padding: var(--space-3) var(--space-2);
      font-size: var(--text-caption);
      color: var(--text-muted);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border-subtle);
    }

    td {
      padding: var(--space-3) var(--space-2);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>

    function renderDashboard(key) {
      const data = archetypeData[key];
      if (!data) return;

      // Update Top Tags
      document.getElementById('activeArchetypeTag').innerText = data.tag;
      document.getElementById('archetypeSummaryText').innerText = data.summary;
      document.getElementById('primaryActionBtn').innerText = data.primaryAction;

      // Update Sidebar Nav
      const navList = document.getElementById('sidebarNavList');
      navList.innerHTML = '';
      data.nav.forEach(item => {
        const li = document.createElement('li');
        li.className = `nav-item ${item.active ? 'active' : ''}`;
        li.innerHTML = `
          <a href="#">
            <span style="display: flex; align-items: center; gap: 8px;">
              <span>${item.icon}</span>
              <span>${item.name}</span>
            </span>
            ${item.count ? `<span style="font-size: 11px; color: var(--text-muted); font-weight: 600;">${item.count}</span>` : ''}
            ${item.tag ? `<span class="nav-tag">${item.tag}</span>` : ''}
          </a>
        `;
        navList.appendChild(li);
      });

      // Update KPIs
      const kpiContainer = document.getElementById('kpiGrid');
      kpiContainer.innerHTML = '';
      data.kpis.forEach(kpi => {
        const card = document.createElement('div');
        card.className = 'kpi-card';
        card.innerHTML = `
          <div class="kpi-label">
            <span>${kpi.label}</span>
            <span>${kpi.icon}</span>
          </div>
          <div class="kpi-value">${kpi.value}</div>
          <div class="kpi-delta" style="color: ${kpi.isPositive ? 'var(--brand-emerald)' : 'var(--brand-amber)'};">
            ${kpi.delta}
          </div>
        `;
        kpiContainer.appendChild(card);
      });

      // Update Table
      document.getElementById('tableTitle').innerText = data.table.title;
      const headerRow = document.getElementById('tableHeaderRow');
      headerRow.innerHTML = data.table.headers.map(h => `<th>${h}</th>`).join('');

      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = data.table.rows.map(row => {
        return `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
      }).join('');

      // Update Secondary Widget
      document.getElementById('secondaryWidgetTitle').innerText = data.widget.title;
      document.getElementById('secondaryWidgetContent').innerHTML = data.widget.content;
    }

    function switchArchetype(key, btn) {
      document.querySelectorAll('.archetype-pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderDashboard(key);
    }

    // Check URL parameters on load
    const urlParams = new URLSearchParams(window.location.search);
    const archetypeParam = urlParams.get('archetype') || 'import';
    
    // Select correct pill
    document.querySelectorAll('.archetype-pill').forEach(btn => {
      if (btn.getAttribute('onclick').includes(archetypeParam)) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    renderDashboard(archetypeParam);

    // Theme Switcher Logic
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const sunIcon = document.getElementById('themeIconSun');
    const moonIcon = document.getElementById('themeIconMoon');

    themeToggleBtn.addEventListener('click', () => {
      const htmlEl = document.documentElement;
      const currentTheme = htmlEl.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      htmlEl.setAttribute('data-theme', newTheme);
      sunIcon.style.display = newTheme === 'dark' ? 'block' : 'none';
      moonIcon.style.display = newTheme === 'dark' ? 'none' : 'block';
    });
  </script>
